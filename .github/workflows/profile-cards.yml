name: Profile Cards

on:
  schedule:
    - cron: "0 3 * * *"          # once a day at 03:00 UTC
  workflow_dispatch:             # allow manual runs

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- TROPHIES ----------
      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: "username=${{ github.repository_owner }}&theme=onedark&column=7&margin-w=15&margin-h=15"
          path: trophy.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # ---------- ACHIEVEMENTS (Metrics) ----------
      - name: Generate achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          output_action: none          # we handle the commit ourselves

      # ---------- COMMIT ----------
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only add files that exist
          [ -f trophy.svg ] && git add trophy.svg || true
          [ -f metrics.achievements.svg ] && git add metrics.achievements.svg || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update profile cards [skip ci]"
            git push
          fi
