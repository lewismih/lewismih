name: Profile Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- TROPHIES ----------
      - name: Generate trophy card
        uses: soulteary/github-profile-trophy-action@v1
        with:
          options: "username=${{ github.repository_owner }}&theme=onedark&column=7&margin-w=15&margin-h=15"
          path: trophy.svg
          token: ${{ secrets.METRICS_TOKEN }}
        continue-on-error: true          # don't stop the whole job if this fails

      # ---------- ACHIEVEMENTS ----------
      - name: Generate achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          output_action: none
        continue-on-error: true          # don't stop the whole job if this fails

      # ---------- SAFE COMMIT ----------
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Checking generated files..."
          ls -la *.svg || true

          # Only stage files that actually exist
          if [ -f trophy.svg ]; then
            echo "Adding trophy.svg"
            git add trophy.svg
          else
            echo "trophy.svg not found – skipping"
          fi

          if [ -f metrics.achievements.svg ]; then
            echo "Adding metrics.achievements.svg"
            git add metrics.achievements.svg
          else
            echo "metrics.achievements.svg not found – skipping"
          fi

          # Commit only if something was staged
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update profile cards [skip ci]"
            git push
          fi
